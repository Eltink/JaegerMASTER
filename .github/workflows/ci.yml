name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m py_compile main.py Alles_Dabei.py Pumpe_und_Ventile.py ventil_toggle.py shot_dispenser/*.py tests/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests
